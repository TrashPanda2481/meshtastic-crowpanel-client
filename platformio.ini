; CrowPanel 5.79" e-paper  --  Meshtastic client
; Board: Elecrow CrowPanel ESP32 5.79" HMI  (ESP32-S3-WROOM-1-N8R8: 8MB flash, 8MB OPI PSRAM)
;
; Serial is on UART0 via the board's USB-serial bridge, matching Elecrow's
; Arduino-IDE examples (USB CDC On Boot = Disabled). If the serial monitor
; stays blank after upload, flip to native USB CDC by adding:
;   -DARDUINO_USB_MODE=1
;   -DARDUINO_USB_CDC_ON_BOOT=1

[env:crowpanel-579]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- memory layout for the N8R8 module ---
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi   ; QIO flash + OPI (octal) PSRAM

build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    beegee-tokyo/DHT sensor library for ESPx@^1.19.0
    bblanchon/ArduinoJson@^7.2.0

; --- serial monitor ---
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
